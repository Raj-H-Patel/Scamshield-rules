name: Update ScamShield rules
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/build_rules.py
      - run: |
          git config user.name "rules-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rules.json
          git commit -m "Update rules" || exit 0
          git push
